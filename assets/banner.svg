<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.03); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.15); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .animated-float {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .animated-pulse-1 {
        animation: pulseGlow 7s ease-in-out infinite alternate;
        transform-origin: 200px 100px;
      }
      .animated-pulse-2 {
        animation: pulseGlow 9s ease-in-out infinite alternate;
        transform-origin: 1000px 300px;
      }
      .flowing-line {
        stroke-dasharray: 6, 6;
        animation: dashFlow 2s linear infinite;
      }
      .badge-pill {
        transition: transform 0.3s ease;
      }
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .text-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .text-mono {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glowing Orbs -->
  <circle class="animated-pulse-1" cx="220" cy="120" r="140" fill="#38bdf8" filter="url(#orbGlow)" />
  <circle class="animated-pulse-2" cx="980" cy="280" r="160" fill="#818cf8" filter="url(#orbGlow)" />
  <circle class="animated-pulse-1" cx="600" cy="380" r="120" fill="#c084fc" filter="url(#orbGlow)" opacity="0.25" />

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Network / Flow Topology (In background relative to text) -->
  <g opacity="0.35">
    <path class="flowing-line" d="M 150 340 C 300 280, 450 360, 600 310 S 900 240, 1050 320" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flowing-line" d="M 120 180 C 320 220, 500 120, 700 180 S 980 120, 1080 200" fill="none" stroke="#818cf8" stroke-width="1.5" />
    
    <!-- Identity Nodes -->
    <circle cx="150" cy="340" r="5" fill="#38bdf8" />
    <circle cx="600" cy="310" r="6" fill="#818cf8" />
    <circle cx="1050" cy="320" r="5" fill="#c084fc" />
    <circle cx="120" cy="180" r="4" fill="#38bdf8" />
    <circle cx="700" cy="180" r="5" fill="#818cf8" />
    <circle cx="1080" cy="200" r="4" fill="#c084fc" />
  </g>

  <!-- Decorative Shield / Lock Emblem Icon on Top Right -->
  <g class="animated-float" transform="translate(1000, 70)">
    <polygon points="50,10 90,30 90,75 50,100 10,75 10,30" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
    <!-- Keyhole / Identity Lock -->
    <circle cx="50" cy="48" r="9" fill="#ffffff" />
    <polygon points="46,48 54,48 56,66 44,66" fill="#ffffff" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Titles, Subtitles -->
  <!-- Top Category Chip -->
  <g transform="translate(100, 52)">
    <rect width="270" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="18" cy="15" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="20" fill="#94a3b8" font-size="12" class="text-mono" font-weight="600">ENTERPRISE IAM &amp; SSO ECOSYSTEM</text>
  </g>

  <!-- Main Hero Title -->
  <text x="100" y="140" fill="url(#primaryGrad)" font-size="52" class="text-title" filter="url(#glow)">Awesome Enterprise Directory &amp; SSO</text>

  <!-- Subtitle / Tagline -->
  <text x="100" y="185" fill="#f8fafc" font-size="21" class="text-sub">Identity Federation, Single Sign-On &amp; Self-Hosted Identity Providers</text>
  <text x="100" y="218" fill="#94a3b8" font-size="15" class="text-sub">Curated SaaS Platforms, Cloud Directories &amp; Production-Ready Open-Source IdPs</text>

  <!-- Protocol Feature Pills (Foreground Bottom) -->
  <g transform="translate(100, 275)">
    <!-- Pill 1: SAML 2.0 -->
    <g class="badge-pill" transform="translate(0, 0)">
      <rect width="125" height="38" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="62" y="24" fill="#38bdf8" font-size="13" class="text-mono" font-weight="700" text-anchor="middle">SAML 2.0</text>
    </g>

    <!-- Pill 2: OIDC & OAuth 2.1 -->
    <g class="badge-pill" transform="translate(140, 0)">
      <rect width="170" height="38" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
      <text x="85" y="24" fill="#818cf8" font-size="13" class="text-mono" font-weight="700" text-anchor="middle">OIDC / OAuth 2.1</text>
    </g>

    <!-- Pill 3: SCIM 2.0 Sync -->
    <g class="badge-pill" transform="translate(325, 0)">
      <rect width="145" height="38" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" />
      <text x="72" y="24" fill="#c084fc" font-size="13" class="text-mono" font-weight="700" text-anchor="middle">SCIM 2.0 Sync</text>
    </g>

    <!-- Pill 4: LDAP & Active Directory -->
    <g class="badge-pill" transform="translate(485, 0)">
      <rect width="190" height="38" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" />
      <text x="95" y="24" fill="#22d3ee" font-size="13" class="text-mono" font-weight="700" text-anchor="middle">LDAP / Active Directory</text>
    </g>

    <!-- Pill 5: Zero-Trust & MFA -->
    <g class="badge-pill" transform="translate(690, 0)">
      <rect width="175" height="38" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="87" y="24" fill="#34d399" font-size="13" class="text-mono" font-weight="700" text-anchor="middle">Zero-Trust &amp; MFA</text>
    </g>

    <!-- Pill 6: Self-Hosted IdP -->
    <g class="badge-pill" transform="translate(880, 0)">
      <rect width="160" height="38" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="80" y="24" fill="#fbbf24" font-size="13" class="text-mono" font-weight="700" text-anchor="middle">Self-Hosted IdPs</text>
    </g>
  </g>

  <!-- Subtle bottom border line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primaryGrad)" />
</svg>
