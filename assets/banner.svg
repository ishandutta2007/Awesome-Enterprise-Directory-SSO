<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070a12"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="shieldGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#6366f1" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="orbGlow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="25"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".8" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes floatSlow{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.03)}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.15)}}@keyframes radarSweep{0%{transform:rotate(0deg)}}.animated-float{animation:floatSlow 6s ease-in-out infinite}.animated-pulse-1{animation:pulseGlow 7s ease-in-out infinite alternate;transform-origin:200px 100px}.animated-pulse-2{animation:pulseGlow 9s ease-in-out infinite alternate;transform-origin:1000px 300px}.flowing-line{stroke-dasharray:6,6;animation:dashFlow 2s linear infinite}.badge-pill{transition:transform .3s ease}.text-sub,.text-title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.text-title{font-weight:800;letter-spacing:-.5px}.text-sub{font-weight:500}.text-mono{font-family:&apos;SFMono-Regular&apos;,Consolas,&apos;Liberation Mono&apos;,Menlo,monospace}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)"/><circle cx="220" cy="120" r="140" fill="#38bdf8" class="animated-pulse-1" filter="url(#orbGlow)"/><circle cx="980" cy="280" r="160" fill="#818cf8" class="animated-pulse-2" filter="url(#orbGlow)"/><circle cx="600" cy="380" r="120" fill="#c084fc" class="animated-pulse-1" filter="url(#orbGlow)" opacity=".25"/><rect width="1200" height="420" fill="url(#grid)"/><g opacity=".35"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 150 340 C 300 280, 450 360, 600 310 S 900 240, 1050 320" class="flowing-line"/><path fill="none" stroke="#818cf8" stroke-width="1.5" d="M 120 180 C 320 220, 500 120, 700 180 S 980 120, 1080 200" class="flowing-line"/><circle cx="150" cy="340" r="5" fill="#38bdf8"/><circle cx="600" cy="310" r="6" fill="#818cf8"/><circle cx="1050" cy="320" r="5" fill="#c084fc"/><circle cx="120" cy="180" r="4" fill="#38bdf8"/><circle cx="700" cy="180" r="5" fill="#818cf8"/><circle cx="1080" cy="200" r="4" fill="#c084fc"/></g><g class="animated-float" transform="translate(1000, 70)"><polygon fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2" points="50 10 90 30 90 75 50 100 10 75 10 30" filter="url(#glow)"/><circle cx="50" cy="48" r="9" fill="#fff"/><polygon fill="#fff" points="46 48 54 48 56 66 44 66"/></g><g transform="translate(100, 52)"><rect width="270" height="30" fill="#1e293b" stroke="#334155" stroke-width="1" rx="15"/><circle cx="18" cy="15" r="4" fill="#22c55e"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.4;1"/></circle><text x="32" y="20" fill="#94a3b8" class="text-mono" font-size="12" font-weight="600">ENTERPRISE IAM &amp; SSO ECOSYSTEM</text></g><text x="100" y="140" fill="url(#primaryGrad)" class="text-title" filter="url(#glow)" font-size="52">Awesome Enterprise Directory &amp; SSO</text><text x="100" y="185" fill="#f8fafc" class="text-sub" font-size="21">Identity Federation, Single Sign-On &amp; Self-Hosted Identity Providers</text><text x="100" y="218" fill="#94a3b8" class="text-sub" font-size="15">Curated SaaS Platforms, Cloud Directories &amp; Production-Ready Open-Source IdPs</text><g><g class="badge-pill" transform="translate(100, 275) translate(0, 0)"><rect width="125" height="38" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" rx="8"/><text x="62" y="24" fill="#38bdf8" class="text-mono" font-size="13" font-weight="700" text-anchor="middle">SAML 2.0</text></g><g class="badge-pill" transform="translate(100, 275) translate(140, 0)"><rect width="170" height="38" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" rx="8"/><text x="85" y="24" fill="#818cf8" class="text-mono" font-size="13" font-weight="700" text-anchor="middle">OIDC / OAuth 2.1</text></g><g class="badge-pill" transform="translate(100, 275) translate(325, 0)"><rect width="145" height="38" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" rx="8"/><text x="72" y="24" fill="#c084fc" class="text-mono" font-size="13" font-weight="700" text-anchor="middle">SCIM 2.0 Sync</text></g><g class="badge-pill" transform="translate(100, 275) translate(485, 0)"><rect width="190" height="38" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" rx="8"/><text x="95" y="24" fill="#22d3ee" class="text-mono" font-size="13" font-weight="700" text-anchor="middle">LDAP / Active Directory</text></g><g class="badge-pill" transform="translate(100, 275) translate(690, 0)"><rect width="175" height="38" fill="#1e293b" stroke="#10b981" stroke-width="1.2" rx="8"/><text x="87" y="24" fill="#34d399" class="text-mono" font-size="13" font-weight="700" text-anchor="middle">Zero-Trust &amp; MFA</text></g><g class="badge-pill" transform="translate(100, 275) translate(880, 0)"><rect width="160" height="38" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" rx="8"/><text x="80" y="24" fill="#fbbf24" class="text-mono" font-size="13" font-weight="700" text-anchor="middle">Self-Hosted IdPs</text></g></g><rect width="1200" height="4" x="0" y="416" fill="url(#primaryGrad)"/></svg>